name: Check collection
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/fontrevival.py check
      - run: python scripts/fontrevival.py package
      - uses: actions/upload-artifact@v4
        with:
          name: font-revival-packages
          path: dist/
